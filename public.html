<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YOGI GROWING TOGETHER LLP — Capital Management System</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="loading" class="loading-screen"><div class="loader"></div><b>Loading Capital Management System…</b></div>

<div id="app" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="side-brand">
      <img src="/yogi-logo.jpeg" alt="Yogi Growing Together">
      <div><strong>YOGI</strong><span>CAPITAL CONTROL</span></div>
    </div>
    <nav id="nav">
      <button class="nav-item active" data-page="overview"><span>⌂</span>Overview</button>
      <button class="nav-item" data-page="allocation"><span>▦</span>Allocation</button>
      <button class="nav-item" data-page="trading"><span>↗</span>Trading</button>
      <button class="nav-item" data-page="investment"><span>◈</span>Investment</button>
      <button class="nav-item" data-page="reserve"><span>◆</span>Reserve</button>
      <button class="nav-item" data-page="rnd"><span>⚙</span>R&amp;D</button>
      <button class="nav-item" data-page="performance"><span>◒</span>Performance</button>
      <button class="nav-item" data-page="risk"><span>△</span>Risk</button>
      <button class="nav-item" data-page="movements"><span>⇄</span>Capital Movements</button>
      <button class="nav-item" data-page="reports"><span>▤</span>Reports</button>
      <button class="nav-item" data-page="settings"><span>⚙</span>Settings</button>
    </nav>
    <div class="side-footer">
      <div class="live-dot"></div><span>Data: Live</span>
      <small id="sideDate">—</small>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="mobile-title"><button id="menuBtn">☰</button></div>
      <div class="heading">
        <h1 id="orgName">YOGI GROWING TOGETHER LLP</h1>
        <p>Capital Allocation &amp; Performance Control</p>
      </div>
      <div class="top-actions">
        <div class="date-pill">● <span id="topDate">—</span></div>
        <div class="user-pill"><span class="avatar">M</span><div><b>Manager</b><small>Control View</small></div></div>
      </div>
    </header>

    <div class="content">
      <div class="page-head">
        <div><div class="eyebrow">CAPITAL MANAGEMENT SYSTEM</div><h2 id="pageTitle">Overview</h2><p id="pageSub">Executive view of fund capital, allocation and performance.</p></div>
        <div class="periods"><button class="period active">Today</button><button class="period">MTD</button><button class="period">QTD</button><button class="period">Weekly</button></div>
      </div>

      <section id="page-overview" class="page active"></section>
      <section id="page-allocation" class="page"></section>
      <section id="page-trading" class="page"></section>
      <section id="page-investment" class="page"></section>
      <section id="page-reserve" class="page"></section>
      <section id="page-rnd" class="page"></section>
      <section id="page-performance" class="page"></section>
      <section id="page-risk" class="page"></section>
      <section id="page-movements" class="page"></section>
      <section id="page-reports" class="page"></section>
      <section id="page-settings" class="page"></section>
    </div>
  </main>
</div>

<script src="/dashboard.js"></script>
</body>
</html>
