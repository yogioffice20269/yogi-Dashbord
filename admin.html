<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YOGI — Admin Control</title><link rel="stylesheet" href="/styles.css">
<style>
.admin-page{min-height:100vh;background:#f5f7f9}.admin-top{height:72px;background:#071b2b;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.admin-top img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:6px}.admin-brand{display:flex;align-items:center;gap:10px}.admin-brand b{display:block}.admin-brand small{color:#91a8b5}.admin-actions{display:flex;gap:8px}.admin-actions a,.admin-actions button{border:0;border-radius:7px;padding:9px 12px;font-size:11px;font-weight:800;cursor:pointer;text-decoration:none}.view{background:#fff;color:#071b2b}.logout{background:#d34c4c;color:#fff}.admin-layout{display:grid;grid-template-columns:minmax(430px,560px) 1fr;gap:18px;max-width:1700px;margin:auto;padding:18px}.editor-card,.preview-card{background:#fff;border:1px solid #e5ebef;border-radius:10px;box-shadow:0 8px 26px rgba(14,35,50,.07)}.editor-card{padding:18px}.editor-card h2{margin:0;color:#071b2b;font-size:19px}.muted{color:#71808c;font-size:11px;line-height:1.5}.form-section{border-top:1px solid #e7edf0;padding-top:15px;margin-top:15px}.form-section h3{font-size:12px;margin:0 0 10px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px;font-size:10px;font-weight:750;color:#53636d}.field.full{grid-column:1/-1}.field input,.field textarea{width:100%;border:1px solid #d7e0e5;border-radius:7px;padding:9px;background:#fbfcfd;outline:none}.field input:focus,.field textarea:focus{border-color:#0a7544;box-shadow:0 0 0 3px rgba(10,117,68,.08)}.dept-editor{border:1px solid #e2e9ed;border-radius:8px;padding:12px;margin-top:12px}.dept-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.dept-title b{font-size:12px}.items{overflow:auto}.item-row{display:grid;grid-template-columns:1.5fr .65fr .7fr .7fr 34px;gap:6px;margin-bottom:6px;min-width:680px}.item-row input{border:1px solid #d7e0e5;border-radius:6px;padding:7px;font-size:10px}.delete{border:0;background:#fdecec;color:#b73a3a;border-radius:6px;cursor:pointer;font-weight:900}.add-item{border:1px dashed #aebcc4;background:#fff;padding:7px 10px;border-radius:6px;font-size:10px;font-weight:800;cursor:pointer}.save{width:100%;margin-top:16px;border:0;background:#0a7544;color:#fff;padding:12px;border-radius:8px;font-weight:850;cursor:pointer}.save:disabled{opacity:.55}.toggle-row{display:flex;align-items:center;justify-content:space-between;background:#f7faf8;padding:12px;border-radius:8px}.switch{position:relative;width:48px;height:26px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#9aa7ae;border-radius:30px;cursor:pointer}.slider:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 4px #0003}.switch input:checked+.slider{background:#0a7544}.switch input:checked+.slider:before{transform:translateX(22px)}.login-screen{min-height:100vh;background:linear-gradient(135deg,#071b2b,#0b3046);display:grid;place-items:center;padding:20px}.login-card{width:min(390px,100%);background:#fff;border-radius:14px;padding:28px;box-shadow:0 20px 60px #0005}.login-card img{width:85px;height:85px;object-fit:contain;display:block;margin:auto;border-radius:8px}.login-card h1{text-align:center;margin:14px 0 5px;font-size:22px}.login-card p{text-align:center;color:#71808c;font-size:11px}.login-card label{display:grid;gap:6px;font-size:11px;font-weight:750;margin-top:14px}.login-card input{padding:11px;border:1px solid #d6e0e5;border-radius:7px}.login-card button{width:100%;margin-top:16px;padding:11px;border:0;border-radius:7px;background:#0a7544;color:#fff;font-weight:850;cursor:pointer}.login-error{color:#c43d3d;font-size:11px;margin-top:10px;min-height:16px;text-align:center}.preview-card{overflow:hidden;min-height:calc(100vh - 108px)}.preview-card .preview-head{padding:12px 15px;border-bottom:1px solid #e5ebef;font-size:11px;font-weight:800}.preview-card iframe{width:100%;height:calc(100vh - 155px);border:0;background:#f5f7f9}@media(max-width:1000px){.admin-layout{grid-template-columns:1fr}.preview-card{display:none}}@media(max-width:560px){.form-grid{grid-template-columns:1fr}.item-row{grid-template-columns:1fr}.admin-top{padding:0 12px}.admin-brand div{display:none}}
</style>
</head>
<body>
<div id="loginScreen" class="login-screen">
 <div class="login-card"><img src="/yogi-logo.jpeg" alt="Yogi"><h1>Admin Control</h1><p>Capital Management System</p>
 <form id="loginForm"><label>Username<input id="username" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Login</button><div id="loginError" class="login-error"></div></form></div>
</div>
<div id="adminApp" class="admin-page hidden">
 <header class="admin-top"><div class="admin-brand"><img src="/yogi-logo.jpeg" alt="Yogi"><div><b>YOGI CAPITAL CONTROL</b><small>Administrator Editor</small></div></div><div class="admin-actions"><a class="view" href="/">View Dashboard</a><button id="logoutBtn" class="logout">Logout</button></div></header>
 <div class="admin-layout">
  <div class="editor-card"><h2>Edit Dashboard</h2><p class="muted">All changes are saved to the existing server-side dashboard data. Public users cannot edit data.</p>
   <div id="editor"></div><button id="saveBtn" class="save">Save All Changes</button><div id="saveMessage" class="muted" style="text-align:center;margin-top:8px"></div>
  </div>
  <div class="preview-card"><div class="preview-head">LIVE DASHBOARD PREVIEW</div><iframe src="/" title="Dashboard Preview"></iframe></div>
 </div>
</div>
<script src="/admin.js"></script>
</body></html>
